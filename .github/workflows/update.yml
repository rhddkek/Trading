name: 시세 갱신·배포

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 재무지표 전체 다시 수집
        type: boolean
        default: false
  schedule:
    # 한국장 09:00~15:59 KST (UTC 00~06시), 평일
    - cron: "3,23,43 0-6 * * 1-5"
    # 미국장 (UTC 13~21시, 서머타임 포함), 평일
    - cron: "8,28,48 13-21 * * 1-5"
    # 장 마감 후 정리 1회
    - cron: "30 22 * * 1-5"
    # 주말 1회 (재무지표 갱신, 예약 실행 유지)
    - cron: "15 3 * * 6"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 패키지 설치
        run: pip install --quiet yfinance pandas
      - name: 직전 데이터 받기
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/gh-pages/data/stocks.json" -o prev.json || echo "직전 데이터 없음"
      - name: 시세·재무 수집
        run: |
          mkdir -p site/data
          python scripts/fetch.py --prev prev.json --out site/data/stocks.json ${{ inputs.force && '--force-fund' || '' }}
      - name: 배포 (gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp index.html site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "data: $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
